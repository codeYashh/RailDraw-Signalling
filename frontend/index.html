<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2942" id="meta-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RailDraw" />
    <meta name="description" content="Indian Railways S&T Signalling Cable Route CAD Drawing Generator" />
    <title>RailDraw — Indian Railways S&amp;T Cable Route CAD</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('raildraw_theme_mode');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('theme-dark');
            document.documentElement.style.backgroundColor = '#0A111A';
          } else {
            document.documentElement.classList.remove('theme-dark');
            document.documentElement.style.backgroundColor = '#F8FAFC';
          }
          var metaTheme = document.getElementById('meta-theme-color');
          if (metaTheme) {
            metaTheme.setAttribute('content', isDark ? '#0A111A' : '#F8FAFC');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if (
        'serviceWorker' in navigator &&
        window.location.protocol !== 'file:' &&
        window.location.hostname !== 'appassets.androidplatform.net' &&
        !(window.AndroidBridge && window.AndroidBridge.isNativeAndroid && window.AndroidBridge.isNativeAndroid())
      ) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
